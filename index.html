<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallel Parking Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="popups"></div>
  <div id="hud" class="hidden">
    <div id="hud-tl" class="panel"></div>
    <div id="hud-tr" class="panel"></div>
    <div id="hud-bl" class="panel"></div>
    <div id="hud-br" class="panel small"></div>
    <div id="hud-center"></div>
    <div id="hud-park" class="hidden"><div class="label">HOLD STILL...</div><div class="bar"><div id="hud-park-fill"></div></div></div>
    <div id="tutor" class="hidden"></div>
    <div id="bubble" class="hidden"></div>
  </div>
  <div id="screen"></div>
  <!-- Plain loading / error message: works even if the game's code or styles fail to load. -->
  <div id="boot-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0000aa;color:#ffff55;font:16px monospace;text-align:center;padding:24px;z-index:99">
    <div id="boot-text">LOADING...</div>
  </div>
  <script>
    window.__ppsFail = function (title, detail) {
      var box = document.getElementById('boot-msg');
      if (!box) return;
      box.style.display = 'flex';
      document.getElementById('boot-text').innerHTML =
        '<div style="font-size:22px;margin-bottom:16px">' + title + '</div>' +
        '<div style="color:#fff;max-width:640px;line-height:1.7">' + detail + '</div>';
    };
    window.addEventListener('error', function (e) {
      if (!window.__ppsBooted) window.__ppsFail('SOMETHING BROKE', 'Error: ' + (e.message || 'a file failed to load') +
        '<br><br>Try a hard refresh: Ctrl+Shift+R (Cmd+Shift+R on a Mac).');
    }, true);
    setTimeout(function () {
      if (!window.__ppsBooted) window.__ppsFail('STILL LOADING?', 'The game didn\'t start. Try a hard refresh: Ctrl+Shift+R (Cmd+Shift+R on a Mac).' +
        '<br><br>If that doesn\'t help, check that WebGL is enabled in your browser.');
    }, 12000);
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
